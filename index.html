<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dress Code: Your Move</title><style>
:root{--ink:#202544;--purple:#7255d9;--pink:#fa6f9a;--blue:#4b9cde;--cream:#fff9f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(125deg,#d8d2ff,#fce1e9 55%,#c7ebff);min-height:100vh}.shell{max-width:1120px;margin:24px auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px;font-weight:800}.track{height:9px;border-radius:10px;background:#ffffffa0;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));width:0;transition:.4s}.slide{background:#fffffff0;border:1px solid white;box-shadow:0 25px 65px #423d7b26;border-radius:32px;padding:clamp(24px,5vw,60px);min-height:650px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#765ec7;font-weight:900}h1{font-size:clamp(39px,6vw,74px);line-height:1.06;margin:15px 0}h2{font-size:clamp(29px,4vw,48px);line-height:1.12;margin:14px 0}p{font-size:clamp(18px,2.2vw,24px);line-height:1.55;max-width:900px}.scene{background:linear-gradient(100deg,#f0edff,#fff0f5);border-left:6px solid var(--purple);padding:24px 28px;border-radius:18px;margin:15px 0;font-size:clamp(19px,2.2vw,25px);line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:22px 0}.choice{font:inherit;text-align:left;font-size:20px;line-height:1.4;font-weight:650;color:#30305a;border:2px solid #e4ddff;background:white;padding:22px;border-radius:18px;cursor:pointer;transition:.2s}.choice:hover,.choice:focus{border-color:var(--purple);background:#f4f0ff;transform:translateY(-2px)}button{cursor:pointer}.btn{border:0;background:var(--purple);color:white;border-radius:15px;padding:16px 25px;font-size:19px;font-weight:800}.btn.secondary{background:#e9e6f7;color:#383058}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.note{font-size:17px;color:#62657e}.tag{display:inline-block;background:#e9e3ff;color:#5b45ad;padding:9px 15px;border-radius:20px;font-weight:800;margin:5px}.feedback{background:#e9f8f7;border-left:6px solid #29a99b;border-radius:18px;padding:20px 24px;margin:15px 0;font-size:21px;line-height:1.5}.prompt{font-size:19px;font-weight:800;margin-top:20px}.speak{width:100%;min-height:90px;border:2px solid #dad6f0;border-radius:16px;font:inherit;font-size:19px;padding:17px;resize:vertical}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}.mini{font-size:15px;color:#686680}.hero{font-size:100px;line-height:1.1;margin:14px 0}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f3f0ff;padding:17px;border-radius:17px;font-size:18px}.stat strong{font-size:34px;display:block;color:var(--purple)}@media(max-width:650px){.shell{margin:0;padding:10px}.slide{border-radius:22px;min-height:calc(100dvh - 65px);padding:24px}.choices,.summary{grid-template-columns:1fr}.choice{font-size:18px;padding:17px}.hero{font-size:72px}.scene{padding:18px}}
.support{background:#f8f6ff;border:2px solid #e4ddff;border-radius:22px;padding:22px;margin:16px 0}.support-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:22px}.small{font-size:15px;padding:11px 15px}.support-label{font-size:16px;font-weight:850;color:#6a50b8;margin:20px 0 9px}.talk-frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.frame{background:white;border:1px solid #e6e1f4;padding:14px 17px;border-radius:13px;font-size:19px;line-height:1.4}.challenge{background:#fff0e7;border-left:5px solid #f39a60;padding:17px;border-radius:12px;font-size:20px;font-weight:650}.reveal{background:#eaf8f4;border-radius:15px;padding:18px;margin-top:17px;font-size:18px}.reveal p{font-size:19px;margin-bottom:0}@media(max-width:650px){.support{padding:16px}.frame{font-size:18px}}@media print{body{background:white}.shell{max-width:none}.slide{box-shadow:none}.actions,.top{display:none}}

.cover-photo{position:relative;overflow:hidden;border-radius:24px;margin:12px 0 18px;height:clamp(220px,32vw,350px);background:#e6e1f5}.cover-photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}.cover-photo:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#211b4360);pointer-events:none}.scene-photo{margin:16px 0 20px;border-radius:22px;overflow:hidden;background:#edeaff;box-shadow:0 12px 28px #24204818}.scene-photo img{display:block;width:100%;height:clamp(190px,29vw,310px);object-fit:cover;object-position:center 42%}.scene-photo figcaption{font-size:13px;font-weight:650;color:#615b86;padding:10px 17px;background:#f5f1ff}@media(max-width:650px){.scene-photo img{height:190px}}
</style></head><body><main class="shell"><div class="top"><span>YOUR MOVE <span aria-hidden="true">✦</span></span><div class="track"><div class="fill" id="fill"></div></div><span id="progress">START</span></div><section class="slide" id="slide" aria-live="polite"></section></main><script>

const episodePhotos=[{"url": "https://images.pexels.com/photos/5676667/pexels-photo-5676667.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Teenagers at a school workshop"}, {"url": "https://images.pexels.com/photos/5212697/pexels-photo-5212697.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Students collaborating on a classroom presentation"}, {"url": "https://commission.europa.eu/sites/default/files/styles/ewcms_metatag_image/public/2026-02/gettyimages-1707575127-2400x1600.jpg?h=c3635fa2&itok=RxG_yi2L", "alt": "Three teenage classmates reacting to something on a smartphone in a school hallway"}, {"url": "https://images.pexels.com/photos/5306450/pexels-photo-5306450.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Students socialising and working together"}, {"url": "https://images.pexels.com/photos/5306451/pexels-photo-5306451.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Young people collaborating on a project"}, {"url": "https://images.pexels.com/photos/5439148/pexels-photo-5439148.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Candidate at a professional interview"}, {"url": "https://images.pexels.com/photos/17737190/pexels-photo-17737190.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Colleagues discussing a project at work"}, {"url": "https://images.pexels.com/photos/5212352/pexels-photo-5212352.jpeg?auto=compress&cs=tinysrgb&w=1600", "alt": "Students and teacher together in a classroom"}];
function scenePhoto(){const p=episodePhotos[idx];return `<figure class="scene-photo"><img src="${p.url}" alt="${p.alt}" loading="eager" referrerpolicy="no-referrer" onerror="this.parentElement.style.display='none'"><figcaption>Look at the scene · How might clothing affect this situation?</figcaption></figure>`}
const stages=[
{icon:'🎒',title:'The first impression',context:'It’s Monday. Your school has a “smart casual” rule for a guest workshop. You have ten minutes before leaving. Your favourite hoodie is clean, but your shirt is still in the laundry.',question:'What do you do?',choices:[['Wear the hoodie. It’s comfortable and I can still participate.',0,'You arrive relaxed. The teacher reminds everyone of the workshop expectations. You can still participate, but now you need to decide how to respond.'],['Borrow a plain shirt from a family member.',1,'You adapt to the occasion without spending money or changing your personality.'],['Skip the workshop rather than deal with the rule.',-1,'You avoid an awkward moment, but you also miss a chance to try something new.']],talk:'Does what you wear affect how seriously people take you? Should it?',follow:'An invited professional asks for volunteers to present a team idea.'},
{icon:'🎤',title:'The unexpected presentation',context:'Your group has a great idea. The guest asks who wants to present it. One teammate says, “You explain things really well, but do you feel ready to go up there?”',question:'How do you respond?',choices:[['Volunteer and focus on making the idea clear.',1,'Your explanation is strong. The guest pays attention to your ideas, not just your clothes. Preparation and communication matter.'],['Ask a teammate to present because you feel out of place.',0,'Your group succeeds, but you wonder whether your discomfort stopped you from taking an opportunity.'],['Say the workshop is superficial and refuse to join.',-1,'Your point about appearance may be valid, but refusing to participate means your ideas are never heard.']],talk:'Can an outfit affect confidence even when it does not affect ability?',follow:'At lunch, a classmate comments on someone else’s outfit.'},
{icon:'🧑‍🤝‍🧑',title:'The group chat',context:'A photo from the workshop appears in the class chat. Someone writes, “Why is Leo dressed like he’s going to a job interview? 😂” Other people start reacting.',question:'What would you actually do?',choices:[['Join in with a joke to avoid looking boring.',-1,'The joke gets a few reactions, but Leo stops replying. Fitting in can come at someone else’s expense.'],['Message: “He looks fine. Can we talk about the project?”',1,'You challenge the joke without making a dramatic speech. You help set a different group norm.'],['Ignore it and message Leo privately later.',1,'Private support may matter. It also leaves the public group norm unchanged.']],talk:'Where is the line between friendly teasing and social pressure?',follow:'On Friday, you are invited to a birthday gathering.'},
{icon:'🎉',title:'The birthday invitation',context:'The invitation says “dress to impress”. Your friends are sharing outfit photos. You prefer simple clothes, and you don’t want to buy anything new.',question:'What’s your plan?',choices:[['Wear something I already own, but style it for the occasion.',1,'You show that respecting the occasion does not require expensive brands.'],['Buy an expensive outfit just to match the group.',-1,'You may feel included for one evening, but the cost is real. Belonging should not depend on spending.'],['Wear my usual clothes and tell anyone who comments to get over it.',0,'Being yourself matters. A confrontational response, though, could create unnecessary tension.']],talk:'How can you belong to a group without copying everyone?',follow:'A friend asks you to help with a community event.'},
{icon:'📸',title:'A public-facing role',context:'You and a friend volunteer to welcome visitors at a gaming and technology event. Organisers ask volunteers to wear plain dark tops and name badges so visitors can recognise them.',question:'What makes the most sense?',choices:[['Follow the guideline because it helps visitors identify volunteers.',1,'Here, clothing has a practical purpose: it communicates your role and makes you approachable.'],['Wear a bright costume because it shows personality.',0,'Your outfit might be fun, but visitors could struggle to identify who can help them.'],['Refuse because any clothing rule is unfair.',-1,'Some rules are unnecessary, but this one has a clear purpose. It is worth evaluating rules individually.']],talk:'What is the difference between a useful dress code and an unfair one?',follow:'A month later, a new opportunity appears.'},
{icon:'💼',title:'Your first interview',context:'You apply for a paid weekend role at a local creative studio. Their social media looks relaxed, but the interview invitation gives no dress instructions. You own jeans, clean trainers and a simple jacket.',question:'What would you choose?',choices:[['Clean jeans, trainers and a neat jacket; prepare good questions.',1,'You choose a reasonable middle ground for a creative workplace and focus on showing genuine interest.'],['A formal suit because every interview requires one.',0,'A suit can work in some industries, but it may be unnecessary here. Context matters more than one universal rule.'],['Whatever is on the floor; only skills should matter.',-1,'Skills should matter most. Still, basic preparation and presentation can communicate care and reliability.']],talk:'Should employers judge candidates by appearance? What is a fair expectation?',follow:'The interviewer gives you a surprising task.'},
{icon:'🧩',title:'A client meeting',context:'The studio asks you to help present a concept to a client. The team says, “Wear something neat but comfortable. You’ll be talking to people you’ve never met.”',question:'How do you handle it?',choices:[['Ask what “neat” means for this client and adapt.',1,'Asking a sensible question shows awareness and helps you avoid assumptions.'],['Copy the manager’s exact outfit.',0,'You might fit in, but copying someone else is not necessary to look professional.'],['Tell the team clothes are irrelevant and ignore the request.',-1,'Your opinion is understandable, but the team is coordinating a shared impression for a reason.']],talk:'Is adapting your appearance a loss of individuality or a social skill?',follow:'You notice a problem with the company’s clothing expectations.'},
{icon:'⚖️',title:'A rule worth questioning',context:'A teammate says they cannot afford the shoes suggested by the manager. Another teammate says the dress standard feels different for boys and girls.',question:'What would you suggest?',choices:[['Ask for clear, affordable, role-related standards that apply fairly.',1,'You support professionalism and fairness at the same time.'],['Tell them to follow the rules without complaining.',-1,'This overlooks genuine barriers and unequal expectations.'],['Demand that every dress code disappear immediately.',0,'The concerns deserve attention, but a practical revision may solve the problem more effectively.']],talk:'When should you adapt to a rule, and when should you challenge it?',follow:'It is time to decide what you actually believe.'}
];

const discussionSupport=[
{starter:['People might take someone more seriously when …','However, I don’t think clothes should …'],ideas:['first impressions','effort and respect','skills vs appearance'],example:'A neat outfit may show that someone has prepared, but it doesn’t prove they are intelligent.',follow:'Would your answer change if it were an ordinary school day?'},
{starter:['I would feel more confident if …','Even if I felt uncomfortable, I could …'],ideas:['self-confidence','preparation','fear of being judged'],example:'I might feel nervous in casual clothes, but knowing my topic well would help me speak confidently.',follow:'What matters more: looking confident or actually being prepared?'},
{starter:['A joke becomes hurtful when …','If I were in the group chat, I might …'],ideas:['the other person’s reaction','public embarrassment','peer pressure'],example:'A joke stops being funny when everyone laughs except the person it is about.',follow:'What could you write in the chat without sounding aggressive?'},
{starter:['I can fit in without …','I would probably wear … because …'],ideas:['reusing clothes','shared expectations','personal style'],example:'I could wear my usual jeans with a nicer shirt. I don’t need to buy something expensive to belong.',follow:'What if all your friends were wearing expensive brands?'},
{starter:['This rule seems useful because …','It would become unfair if …'],ideas:['recognising staff','safety and clarity','comfort and affordability'],example:'A name badge and a plain top help visitors find volunteers, but the organisers should not demand costly clothes.',follow:'Can you think of another place where clothing has a practical purpose?'},
{starter:['For this interview, I would choose …','I think an employer should focus on …'],ideas:['company culture','clean and appropriate clothes','skills and reliability'],example:'I would wear clean jeans and a jacket because the studio looks creative, but I would also prepare for the questions.',follow:'Would you dress differently for a bank interview?'},
{starter:['Adapting to a situation doesn’t mean …','Before choosing my outfit, I would ask …'],ideas:['reading the room','personal identity','professional teamwork'],example:'I can keep my own style while choosing something suitable for a client meeting.',follow:'Where would you refuse to change your style, even if someone asked?'},
{starter:['A fair dress code should …','I would challenge the rule if …'],ideas:['equal treatment','reasonable prices','clear purpose'],example:'A fair rule should be affordable and apply equally to everyone, regardless of gender.',follow:'How could you suggest a change politely to the manager?'}
];
let supportOpen=false;
function discussionMarkup(){const d=discussionSupport[idx];return `<div class="support"><div class="support-head"><strong>🧠 Speaking support</strong><button class="btn secondary small" onclick="toggleSupport()">${supportOpen?'Hide example & ideas −':'Show ideas & example +'} </button></div><p class="support-label">Step 1 · Choose a position</p><div class="talk-frames">${d.starter.map(x=>`<div class="frame">${x}</div>`).join('')}</div><p class="support-label">Step 2 · Add a reason or example</p><div class="talk-frames"><div class="frame">One reason is that …</div><div class="frame">For example, imagine …</div><div class="frame">On the other hand, …</div></div>${supportOpen?`<div class="reveal"><strong>Ideas you could mention</strong><div>${d.ideas.map(x=>`<span class="tag">${x}</span>`).join('')}</div><p><strong>Model answer:</strong> ${d.example}</p></div>`:''}<p class="support-label">Step 3 · Go deeper</p><div class="challenge">${d.follow}</div><p class="note">Aim for 3–5 sentences. You can disagree with the model answer.</p></div>`}
function toggleSupport(){supportOpen=!supportOpen;show()}

let idx=-1,score=0,history=[],phase='choice';const el=document.getElementById('slide');function update(){document.getElementById('fill').style.width=`${Math.max(0,idx+1)/stages.length*100}%`;document.getElementById('progress').textContent=idx<0?'START':idx>=stages.length?'FINISH':`${idx+1} / ${stages.length}`}
function show(){update();if(idx===-1){el.innerHTML=`<div class="eyebrow">B2 • Interactive story • 35–45 minutes</div><figure class="cover-photo"><img src="https://images.pexels.com/photos/5212352/pexels-photo-5212352.jpeg?auto=compress&cs=tinysrgb&w=1800" alt="Teenagers together at school" loading="eager"></figure><h1>DRESS CODE:<br>YOUR MOVE</h1><p>Eight decisions. Different consequences. No perfect outfit and no simple answers.</p><div class="scene">You’re 15. Over the next few months, your choices about clothes, confidence and other people could open doors — or make things more complicated.</div><div class="actions"><button class="btn" onclick="start()">Start the story →</button></div><p class="note">Speak in English. Explain each choice before clicking. Your decisions change the feedback and final reflection.</p>`;return}if(idx===stages.length){let label=score>=6?'A thoughtful adapter':score>=2?'An independent thinker':'A rule challenger';el.innerHTML=`<div class="eyebrow">Your story • Reflection</div><div class="hero">🏁</div><h2>${label}</h2><p>Your choices show how you balance self-expression, relationships and expectations. This is not a personality test: there are no fixed labels.</p><div class="summary"><div class="stat"><strong>${history.length}</strong>decisions made</div><div class="stat"><strong>${history.filter(x=>x.points===1).length}</strong>context-aware choices</div><div class="stat"><strong>${history.filter(x=>x.points<=0).length}</strong>choices to reconsider</div></div><p class="prompt">Final speaking challenge — 60 seconds</p><div class="scene">“A dress code can be useful when … However, it becomes a problem if … In my future career, I think … When it comes to fitting in with friends, …”</div><p class="prompt">Discuss:</p><p>1. Which decision would you change and why?<br>2. Which rule was genuinely useful?<br>3. How can people express themselves and respect a situation at the same time?<br>4. What should never be judged by clothing?</p><div class="actions"><button class="btn" onclick="restart()">Play again with different choices ↻</button><button class="btn secondary" onclick="window.print()">Print reflection</button></div>`;return}const s=stages[idx];if(phase==='choice'){el.innerHTML=`<div class="eyebrow">Episode ${idx+1} of ${stages.length} • Make a decision</div><div class="hero">${s.icon}</div><h2>${s.title}</h2>${scenePhoto()}<div class="scene">${s.context}</div><p class="prompt">${s.question}</p><div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="tag">${String.fromCharCode(65+i)}</span><br>${c[0]}</button>`).join('')}</div><p class="note">Before choosing: explain what could happen next. Use “I’d probably … because …”</p>`}else{let h=history[history.length-1];el.innerHTML=`<div class="eyebrow">Episode ${idx+1} • The consequences</div><h2>${s.icon} What happens next?</h2>${scenePhoto()}<div class="scene">You chose: <strong>${h.text}</strong></div><div class="feedback">${h.feedback}</div><p class="prompt">🗣️ Discuss in English</p><div class="scene">${s.talk}</div>${discussionMarkup()}<p class="prompt">Useful language</p><div><span class="tag">make an impression</span><span class="tag">fit in</span><span class="tag">feel out of place</span><span class="tag">adapt to the situation</span><span class="tag">be judged by appearances</span></div><p class="note">Coming up: ${s.follow}</p><div class="actions"><button class="btn" onclick="next()">${idx===stages.length-1?'See final reflection →':'Continue the story →'}</button><button class="btn secondary" onclick="redo()">Try another choice</button></div>`}}
function start(){idx=0;show()}function choose(i){let c=stages[idx].choices[i];history.push({text:c[0],points:c[1],feedback:c[2]});score+=c[1];phase='feedback';supportOpen=false;show()}function next(){idx++;phase='choice';supportOpen=false;show()}function redo(){const last=history.pop();score-=last.points;phase='choice';show()}function restart(){idx=-1;score=0;history=[];phase='choice';show()}show();
</script></body></html>
